[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bai-harness"
version = "0.1.0"
description = "Minimal personal AI harness runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
bai = "bai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
